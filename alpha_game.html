<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Alpha Run</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b14;font-family:Arial,sans-serif}
button{font:inherit}
#app{position:relative;width:100vw;height:100vh;overflow:hidden;background:linear-gradient(#101d39,#203c58 58%,#0b1119)}
#world{position:absolute;left:0;top:0;height:100%;width:9000px;transform:translateX(0)}
#ground{position:absolute;left:0;bottom:0;width:9000px;height:75px;background:repeating-linear-gradient(45deg,#263a2c 0 20px,#1b2d23 20px 40px);border-top:5px solid #57dd70}
#player{position:absolute;width:38px;height:52px;border-radius:10px;background:linear-gradient(135deg,#36b6ff,#1754ff);box-shadow:0 0 18px #238cff;z-index:5}
#player:after{content:"";position:absolute;right:7px;top:10px;width:7px;height:7px;background:#fff;border-radius:50%}
.platform{position:absolute;height:18px;border-radius:7px;background:#9c70ff;box-shadow:0 0 12px #7044ff}
.coin{position:absolute;width:24px;height:24px;border:3px solid #fff29a;border-radius:50%;background:#ffd21c;box-shadow:0 0 15px #ffc400}
.spike{position:absolute;width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-bottom:34px solid #ff3154;filter:drop-shadow(0 0 5px red)}
.finish{position:absolute;width:58px;height:95px;border:4px solid #fff;border-radius:9px;background:linear-gradient(#ffd83a,#ff7a00);box-shadow:0 0 22px orange;z-index:2}
.finish b{display:block;font-size:10px;color:#fff;margin-top:7px;text-align:center}
#hud{position:fixed;z-index:30;top:8px;left:8px;right:8px;display:flex;gap:6px;justify-content:space-between;direction:ltr}
.h{background:#0009;color:#fff;border:1px solid #ffffff33;border-radius:12px;padding:8px 11px;font-weight:bold;font-size:14px}
#levelLabel{direction:rtl}
#controls{position:fixed;z-index:40;left:0;right:0;bottom:12px;height:90px}
.btn{position:absolute;width:68px;height:68px;border-radius:50%;border:2px solid #ffffff55;background:#101b2ddd;color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px}
.btn:active{transform:scale(.91);background:#245cff}
#left{left:18px}#right{left:96px}#jump{right:18px}
#menu,#shop,#levels,#modal,#win,#gameover{position:fixed;z-index:100;inset:0;background:#050914ee;display:none;align-items:center;justify-content:center;padding:18px}
.card{width:min(430px,94vw);max-height:90vh;overflow:auto;background:#111a2b;border:1px solid #ffffff22;border-radius:22px;padding:22px;color:#fff;text-align:center}
.card h1{margin:0 0 12px;color:#ffd21c}
.big{width:100%;padding:14px;margin:7px 0;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:bold}
.alt{background:#26344e}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.level{padding:16px;border-radius:14px;background:#1c2b42;color:#fff;border:1px solid #ffffff18}
.level.lock{opacity:.45}
.shopitem{padding:14px;margin:9px 0;border-radius:14px;background:#1a2940;text-align:right}
.shopitem button{float:left;padding:8px 12px;border:0;border-radius:9px;background:#2563eb;color:#fff}
small{color:#aebbd0}
#toast{position:fixed;z-index:200;left:50%;bottom:115px;transform:translateX(-50%);background:#000d;color:#fff;padding:11px 16px;border-radius:12px;display:none;white-space:nowrap}
#codeInput{width:100%;padding:13px;border-radius:10px;border:0;text-align:center;font-size:20px;margin:8px 0}
.stat{display:flex;justify-content:space-between;background:#0b1321;padding:10px;border-radius:10px;margin:6px 0}
</style>
</head>
<body>
<div id="app">
  <div id="world">
    <div id="ground"></div>
    <div id="player"></div>
    <div id="objects"></div>
  </div>
</div>

<div id="hud">
  <div class="h">🪙 <span id="coins">0</span></div>
  <div class="h" id="levelLabel">مرحله <span id="level">1</span>/10</div>
  <div class="h">❤️ <span id="lives">3</span></div>
</div>

<div id="controls">
  <div class="btn" id="left">◀</div>
  <div class="btn" id="right">▶</div>
  <div class="btn" id="jump">▲</div>
</div>

<div id="menu" style="display:flex">
  <div class="card">
    <h1>ALPHA RUN</h1>
    <p>۱۰ مرحله سخت • Alpha Coin • فروشگاه</p>
    <div class="stat"><span>🪙 سکه</span><b id="menuCoins">0</b></div>
    <div class="stat"><span>📅 روزهای بازی</span><b id="days">0/30</b></div>
    <button class="big" onclick="openLevels()">🗺️ انتخاب مرحله</button>
    <button class="big" onclick="openShop()">🛒 فروشگاه</button>
    <button class="big alt" onclick="startLevel(progress.currentLevel||1)">▶️ ادامه بازی</button>
    <button class="big alt" onclick="openCode()">🔐 کد مخفی</button>
  </div>
</div>

<div id="levels">
  <div class="card">
    <h1>🗺️ مراحل</h1>
    <div id="levelGrid" class="grid"></div>
    <button class="big alt" onclick="closeAll()">بستن</button>
  </div>
</div>

<div id="shop">
  <div class="card">
    <h1>🛒 فروشگاه آلفا</h1>
    <div class="stat"><span>🪙 موجودی</span><b id="shopCoins">0</b></div>
    <div id="shopList"></div>
    <button class="big alt" onclick="closeAll()">بستن</button>
  </div>
</div>

<div id="modal">
  <div class="card">
    <h1>🔐 کد مخفی</h1>
    <p>کد عددی را وارد کن</p>
    <input id="codeInput" type="number" inputmode="numeric" placeholder="مثلاً 1379">
    <button class="big" onclick="checkCode()">تأیید</button>
    <button class="big alt" onclick="closeAll()">بستن</button>
    <p id="codeMsg"></p>
  </div>
</div>

<div id="win">
  <div class="card">
    <h1>🎉 مرحله تمام شد!</h1>
    <p id="winText"></p>
    <button class="big" onclick="nextLevel()">مرحله بعد</button>
    <button class="big alt" onclick="openLevels()">انتخاب مرحله</button>
  </div>
</div>

<div id="gameover">
  <div class="card">
    <h1>💀 باختی!</h1>
    <p>این مرحله دوباره شروع می‌شود.</p>
    <button class="big" onclick="restartLevel()">دوباره</button>
    <button class="big alt" onclick="showMenu()">منو</button>
  </div>
</div>

<div id="toast"></div>

<script>
const SAVE_KEY="alpha_run_save_v1";
let progress=JSON.parse(localStorage.getItem(SAVE_KEY)||"null")||{
  coins:0,currentLevel:1,unlocked:1,days:0,lastDay:"",
  collectedCodes:{},items:{}
};

function save(){localStorage.setItem(SAVE_KEY,JSON.stringify(progress))}
function today(){return new Date().toISOString().slice(0,10)}
function registerPlayDay(){
  if(progress.lastDay!==today()){
    progress.lastDay=today();
    progress.days=Math.min(30,(progress.days||0)+1);
    save();
  }
}
registerPlayDay();

const shopItems=[
 {id:"speed",name:"⚡ آلفا بوست",price:120,desc:"سرعت بیشتر در بازی"},
 {id:"heart",name:"❤️ قلب آلفا",price:180,desc:"شروع مرحله با یک جان اضافه"},
 {id:"jump",name:"🚀 پرش آلفا",price:220,desc:"پرش قوی‌تر"},
 {id:"skin",name:"🔵 اسکین آبی آلفا",price:350,desc:"ظاهر ویژه بازیکن"},
 {id:"skate",name:"🛹 اسکیت آلفا",price:0,desc:"جایزه ویژه؛ فقط پس از ۳۰ روز بازی روزانه باز می‌شود"}
];

function updateTexts(){
  document.getElementById("coins").textContent=progress.coins;
  document.getElementById("menuCoins").textContent=progress.coins;
  document.getElementById("shopCoins").textContent=progress.coins;
  document.getElementById("days").textContent=(progress.days||0)+"/30";
}
function showMenu(){
  closeAll();document.getElementById("menu").style.display="flex";updateTexts();
}
function closeAll(){
  ["menu","shop","levels","modal","win","gameover"].forEach(id=>document.getElementById(id).style.display="none");
}
function openLevels(){
  closeAll();const g=document.getElementById("levelGrid");g.innerHTML="";
  for(let i=1;i<=10;i++){
    const b=document.createElement("button");b.className="level"+(i>progress.unlocked?" lock":"");
    b.innerHTML=(i<=progress.unlocked?"▶️ ":"🔒 ")+ "مرحله "+i;
    b.onclick=()=>{if(i<=progress.unlocked)startLevel(i);else toast("این مرحله هنوز قفل است")};
    g.appendChild(b);
  }
  document.getElementById("levels").style.display="flex";
}
function openShop(){
  closeAll();const list=document.getElementById("shopList");list.innerHTML="";
  shopItems.forEach(it=>{
    const owned=progress.items[it.id];
    const unlocked=it.id!=="skate" || (progress.days||0)>=30;
    const d=document.createElement("div");d.className="shopitem";
    let action="";
    if(it.id==="skate" && !unlocked) action="<small>🔒 "+(30-(progress.days||0))+" روز دیگر</small>";
    else if(owned) action="<small>✅ خریداری شده</small>";
    else action=`<button onclick="buy('${it.id}')">${it.price?it.price+" 🪙":"دریافت"}</button>`;
    d.innerHTML=`<b>${it.name}</b><br><small>${it.desc}</small><br>${action}`;
    list.appendChild(d);
  });
  document.getElementById("shop").style.display="flex";updateTexts();
}
function buy(id){
  const it=shopItems.find(x=>x.id===id);
  if(id==="skate"){
    if((progress.days||0)<30){toast("اسکیت آلفا بعد از ۳۰ روز بازی روزانه باز می‌شود");return}
    progress.items[id]=true;save();toast("🛹 اسکیت آلفا باز شد!");openShop();return;
  }
  if(progress.items[id]){toast("قبلاً خریدی");return}
  if(progress.coins<it.price){toast("سکه کافی نیست");return}
  progress.coins-=it.price;progress.items[id]=true;save();toast("خرید انجام شد");openShop();
}
function openCode(){closeAll();document.getElementById("modal").style.display="flex"}
function checkCode(){
  const c=document.getElementById("codeInput").value;
  const codes={"1379":50,"2048":100,"7777":250};
  if(codes[c] && !progress.collectedCodes[c]){
    progress.coins+=codes[c];progress.collectedCodes[c]=true;save();
    document.getElementById("codeMsg").textContent="🎉 درست! +"+codes[c]+" Alpha Coin";
  }else if(progress.collectedCodes[c]){
    document.getElementById("codeMsg").textContent="این کد قبلاً استفاده شده است.";
  }else document.getElementById("codeMsg").textContent="❌ کد اشتباه است.";
  updateTexts();
}
function toast(t){
  const e=document.getElementById("toast");e.textContent=t;e.style.display="block";
  clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display="none",1800);
}

let level=1,x=80,y=75,vx=0,vy=0,onGround=true,lives=3,camera=0,playing=false;
let keys={left:false,right:false};
const player=document.getElementById("player"),world=document.getElementById("world"),objects=document.getElementById("objects");

const levels=[
 {len:1700,coins:[250,330,470,530,735,800,1040,1100,1300,1450],spikes:[600,635,900,935,1200,1235],plats:[[430,170,120],[700,240,120],[1000,160,140]]},
 {len:1900,coins:[230,300,430,520,650,760,900,1040,1200,1450,1650],spikes:[350,370,580,600,820,840,1100,1120,1400],plats:[[420,180,100],[680,250,120],[920,180,110],[1280,260,130],[1550,180,100]]},
 {len:2100,coins:[200,280,450,560,720,850,980,1150,1300,1500,1700,1850],spikes:[330,350,500,520,670,690,880,900,1080,1100,1360,1380,1600],plats:[[400,220,100],[600,300,100],[780,220,120],[1000,300,110],[1250,220,120],[1500,300,120]]},
 {len:2300,coins:[220,320,460,600,760,920,1080,1250,1420,1600,1800,2000],spikes:[400,420,650,670,900,920,1150,1170,1450,1470,1750,1770,1950],plats:[[480,260,100],[700,340,110],[980,250,120],[1220,340,120],[1500,260,120],[1750,350,110]]},
 {len:2500,coins:[200,340,500,650,800,960,1120,1300,1480,1660,1850,2050,2250],spikes:[300,320,450,470,700,720,870,890,1050,1070,1200,1220,1400,1420,1600,1620,1900,1920,2150],plats:[[550,280,100],[760,360,110],[1000,280,120],[1280,360,120],[1550,280,120],[1800,360,120],[2100,280,120]]},
 {len:2700,coins:[200,300,420,550,700,850,1000,1160,1320,1480,1650,1820,2000,2200,2400],spikes:[340,360,480,500,620,640,780,800,940,960,1100,1120,1260,1280,1450,1470,1700,1720,1950,1970,2250],plats:[[430,220,100],[680,320,110],[900,220,120],[1180,340,120],[1400,250,120],[1600,360,120],[1850,260,120],[2150,340,120],[2400,230,120]]},
 {len:2900,coins:[200,350,500,650,800,950,1100,1250,1400,1550,1700,1850,2000,2200,2400,2600],spikes:[280,300,430,450,580,600,730,750,880,900,1030,1050,1180,1200,1350,1370,1500,1520,1750,1770,2050,2070,2350,2370,2600],plats:[[380,250,110],[600,360,110],[820,260,120],[1050,370,120],[1300,250,120],[1480,360,120],[1680,260,120],[1950,370,120],[2250,280,120],[2500,360,120]]},
 {len:3100,coins:[200,320,450,580,720,860,1000,1140,1280,1420,1580,1740,1900,2080,2260,2440,2620,2800],spikes:[260,280,400,420,540,560,680,700,820,840,980,1000,1120,1140,1260,1280,1450,1470,1650,1670,1850,1870,2050,2070,2250,2270,2450,2470,2700],plats:[[350,300,100],[520,400,110],[760,280,110],[930,390,110],[1180,300,120],[1400,400,120],[1600,290,120],[1800,400,120],[2000,300,120],[2200,410,120],[2400,300,120],[2600,400,120]]},
 {len:3400,coins:[180,300,420,540,680,820,960,1100,1240,1380,1520,1660,1800,1950,2100,2250,2400,2550,2700,2850,3050,3250],spikes:[250,270,370,390,490,510,610,630,750,770,900,920,1040,1060,1180,1200,1320,1340,1460,1480,1620,1640,1780,1800,2000,2020,2200,2220,2400,2420,2600,2620,2800,2820,3000,3020],plats:[[330,280,100],[520,390,110],[700,300,110],[880,420,110],[1080,300,120],[1260,400,120],[1450,290,120],[1650,410,120],[1850,300,120],[2050,420,120],[2250,300,120],[2450,410,120],[2650,300,120],[2850,420,120],[3100,300,120]]},
 {len:3800,coins:[180,300,430,560,700,840,980,1120,1260,1400,1540,1680,1820,1960,2100,2240,2380,2520,2660,2800,2940,3080,3220,3380,3550,3700],spikes:[230,250,350,370,470,490,590,610,710,730,830,850,950,970,1080,1100,1220,1240,1360,1380,1500,1520,1640,1660,1780,1800,1920,1940,2060,2080,2200,2220,2340,2360,2480,2500,2620,2640,2760,2780,2900,2920,3040,3060,3180,3200,3320,3340,3460,3480,3600,3620],plats:[[300,300,100],[500,410,100],[680,290,110],[860,430,110],[1060,300,120],[1240,420,120],[1440,290,120],[1620,430,120],[1820,300,120],[2020,420,120],[2220,300,120],[2420,430,120],[2620,300,120],[2820,420,120],[3020,300,120],[3220,430,120],[3420,300,120],[3620,420,120]]}
];

function clearObjects(){objects.innerHTML=""}
function addDiv(cls,left,bottom,w,h){
  const e=document.createElement("div");e.className=cls;e.style.left=left+"px";e.style.bottom=bottom+"px";if(w)e.style.width=w+"px";if(h)e.style.height=h+"px";objects.appendChild(e);return e
}
function buildLevel(n){
  clearObjects();const d=levels[n-1];
  d.plats.forEach(p=>addDiv("platform",p[0],p[1],p[2],18));
  d.coins.forEach(c=>{const e=addDiv("coin",c,120,24,24);e.dataset.x=c});
  d.spikes.forEach(s=>addDiv("spike",s,75,32,34));
  const f=addDiv("finish",d.len-90,75,58,95);f.innerHTML="<b>FINISH</b>";
}
function startLevel(n){
  if(n>progress.unlocked)return;
  closeAll();level=n;progress.currentLevel=n;save();registerPlayDay();
  buildLevel(n);x=80;y=75;vx=0;vy=0;camera=0;lives=progress.items.heart?4:3;playing=true;
  document.getElementById("level").textContent=n;document.getElementById("lives").textContent=lives;
  player.style.left=x+"px";player.style.bottom=y+"px";world.style.transform="translateX(0)";
  if(progress.items.speed)speed=6.2;else speed=5;
  if(progress.items.jump)jumpPower=15;else jumpPower=13;
}
function restartLevel(){document.getElementById("gameover").style.display="none";startLevel(level)}
function die(){
  lives--;document.getElementById("lives").textContent=lives;
  if(lives<=0){playing=false;document.getElementById("gameover").style.display="flex";return}
  x=80;y=75;vx=0;vy=0;
}
function collectCoins(){
  document.querySelectorAll(".coin").forEach(c=>{
    if(c.dataset.got)return;
    const cx=+c.dataset.x, cy=120;
    if(x+38>cx&&x<cx+24&&y+52>cy&&y<cy+24){
      c.dataset.got="1";c.style.display="none";progress.coins++;save();updateTexts();
    }
  })
}
function collisions(){
  document.querySelectorAll(".platform").forEach(p=>{
    const px=p.offsetLeft, pw=p.offsetWidth;
    const py=p.offsetTop;
    const bottom=window.innerHeight-py-18;
    if(x+38>px&&x<px+pw&&y<=bottom+18&&y>=bottom-8&&vy<=0){
      y=bottom+18;vy=0;onGround=true;
    }
  });
  document.querySelectorAll(".spike").forEach(s=>{
    const sx=s.offsetLeft;
    if(x+31>sx&&x<sx+32&&y<112)die();
  });
}
function loop(){
  if(playing){
    if(keys.left)vx=-speed;else if(keys.right)vx=speed;else vx*=.82;
    x+=vx;vy-=.62;y+=vy;
    onGround=false;
    if(y<=75){y=75;vy=0;onGround=true}
    collisions();collectCoins();
    const finishX=levels[level-1].len-90;
    if(x>finishX){
      playing=false;
      if(level===progress.unlocked&&level<10)progress.unlocked++;
      progress.coins+=30+level*10;save();updateTexts();
      document.getElementById("winText").innerHTML="🏁 مرحله "+level+" تمام شد!<br><br>پاداش: +"+(30+level*10)+" 🪙";
      document.getElementById("win").style.display="flex";
    }
    camera=Math.max(0,x-innerWidth*.3);
    world.style.transform=`translateX(${-camera}px)`;
    player.style.left=x+"px";player.style.bottom=y+"px";
    if(y<-100)die();
  }
  requestAnimationFrame(loop)
}
function nextLevel(){
  document.getElementById("win").style.display="none";
  if(level<10)startLevel(level+1);else showMenu();
}
function setupHold(id,key){
  const b=document.getElementById(id);
  const down=e=>{e.preventDefault();keys[key]=true},up=e=>{e.preventDefault();keys[key]=false};
  b.addEventListener("touchstart",down,{passive:false});b.addEventListener("touchend",up,{passive:false});
  b.addEventListener("mousedown",down);b.addEventListener("mouseup",up);b.addEventListener("mouseleave",up)
}
setupHold("left","left");setupHold("right","right");
function jump(){if(playing&&onGround){vy=jumpPower;onGround=false}}
document.getElementById("jump").addEventListener("touchstart",e=>{e.preventDefault();jump()},{passive:false});
document.getElementById("jump").addEventListener("mousedown",jump);
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft")keys.left=true;if(e.key==="ArrowRight")keys.right=true;
  if(e.key==="ArrowUp"||e.key===" ")jump();
});
document.addEventListener("keyup",e=>{if(e.key==="ArrowLeft")keys.left=false;if(e.key==="ArrowRight")keys.right=false});
function updateTexts(){
  document.getElementById("coins").textContent=progress.coins;
  document.getElementById("menuCoins").textContent=progress.coins;
  document.getElementById("shopCoins").textContent=progress.coins;
  document.getElementById("days").textContent=(progress.days||0)+"/30";
}
updateTexts();loop();
</script>
</body>
</html>
