<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Alpha Chat - Single File</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#dbeafe,#eef2ff);color:#0f172a}
.app{height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}.chat{width:min(920px,100%);height:min(850px,100%);background:#fff;border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 18px 60px #0f172a20}
header{padding:14px 17px;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;gap:10px;align-items:center}.logo{width:44px;height:44px;border-radius:13px;background:#ffffff22;display:grid;place-items:center;font-size:24px}.brand b{display:block;font-size:18px}.brand small{font-size:11px;opacity:.8}#status{font-size:11px;background:#ffffff22;padding:7px 10px;border-radius:20px}
#messages{flex:1;overflow:auto;padding:15px;background:#f8fafc}.empty{text-align:center;color:#64748b;padding:50px 15px;font-size:13px}
.msg{display:flex;margin:8px 0}.mine{justify-content:flex-start}.other{justify-content:flex-end}.bubble{max-width:82%;padding:9px 12px;background:#fff;border:1px solid #e2e8f0;border-radius:17px;border-bottom-right-radius:5px;box-shadow:0 2px 8px #00000008}.mine .bubble{background:#2563eb;color:#fff;border:0;border-bottom-left-radius:5px;border-bottom-right-radius:17px}
.meta{font-size:10px;color:#64748b;margin-bottom:4px}.mine .meta{color:#dbeafe}.txt{font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}.media{display:block;max-width:320px;max-height:330px;border-radius:12px;margin-top:6px;object-fit:cover}.actions{display:flex;gap:5px;margin-top:6px}.actions button{font-size:10px;padding:4px 7px;border:0;border-radius:7px;cursor:pointer}.mine .actions button{background:#ffffff30;color:#fff}.other .actions button{background:#f1f5f9;color:#475569}
#editBar{display:none;background:#eff6ff;padding:8px 12px;font-size:12px;justify-content:space-between;align-items:center}#editBar button{border:0;background:none;color:#2563eb}
#form{display:flex;gap:7px;padding:9px;border-top:1px solid #e2e8f0;background:#fff}.attach{width:43px;height:43px;border-radius:12px;background:#f1f5f9;display:grid;place-items:center;font-size:20px;cursor:pointer}.attach input{display:none}#text{flex:1;min-width:0;border:1px solid #e2e8f0;border-radius:13px;padding:12px;font-size:14px;outline:0;background:#f8fafc}#form>button{height:43px;padding:0 16px;border:0;border-radius:13px;background:#2563eb;color:#fff;font-weight:bold;cursor:pointer}
.overlay{position:fixed;z-index:10;inset:0;background:#0f172acc;display:flex;align-items:center;justify-content:center;padding:18px}.card{width:min(430px,100%);background:#fff;border-radius:22px;padding:25px}.card h2{margin:0 0 8px}.card p{font-size:13px;color:#64748b;line-height:1.8}.card input{width:100%;padding:13px;border:1px solid #e2e8f0;border-radius:13px;font-size:14px;margin:8px 0}.card button{width:100%;padding:13px;border:0;border-radius:13px;background:#2563eb;color:#fff;font-weight:bold}
@media(max-width:600px){.app{padding:0}.chat{height:100vh;border-radius:0}.bubble{max-width:88%}.media{max-width:260px;max-height:280px}}
</style>
</head>
<body>
<div class="app"><main class="chat">
<header><div class="brand"><div class="logo">💬</div><div><b>Alpha Chat</b><small>چت عمومی</small></div></div><span id="status">🟢 آماده</span></header>
<section id="messages"><div class="empty">برای شروع وارد شو 👋</div></section>
<div id="editBar"><span>✏️ در حال ویرایش پیام</span><button id="cancelEdit">لغو</button></div>
<form id="form"><label class="attach">📎<input id="file" type="file" accept="image/*,video/*"></label><input id="text" maxlength="1000" placeholder="پیامت را بنویس..." autocomplete="off"><button>ارسال</button></form>
</main></div>

<div id="login" class="overlay"><div class="card"><h2>💬 Alpha Chat</h2><p>یک نام انتخاب کن. این نسخه برای تست، پیام‌ها را در مرورگر نگه می‌دارد.</p><input id="name" maxlength="24" placeholder="نام کاربری"><button id="join">ورود به چت</button></div></div>

<script>
let user=localStorage.getItem("alpha_demo_user")||"",messages=JSON.parse(localStorage.getItem("alpha_demo_messages")||"[]"),editId=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const tm=t=>new Date(t).toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"});

function save(){localStorage.setItem("alpha_demo_messages",JSON.stringify(messages))}
function render(){
 const box=$("messages");box.innerHTML="";
 if(!messages.length){box.innerHTML='<div class="empty">هنوز پیامی نیست 👋</div>';return}
 for(const m of messages.slice(-300)){
  const row=document.createElement("div"),mine=m.user===user;row.className="msg "+(mine?"mine":"other");
  const b=document.createElement("div");b.className="bubble";
  let media=m.type==="image"?`<img class="media" src="${m.url}" alt="عکس">`:m.type==="video"?`<video class="media" src="${m.url}" controls playsinline></video>`:"";
  b.innerHTML=`<div class="meta"><b>${esc(m.user)}</b> · ${tm(m.time)} ${m.edited?"· ویرایش‌شده":""}</div>${m.text?`<div class="txt">${esc(m.text)}</div>`:""}${media}`;
  if(mine){let a=document.createElement("div");a.className="actions";a.innerHTML=m.type==="text"?'<button>✏️ ویرایش</button><button>🗑️ حذف</button>':'<button>🗑️ حذف</button>';let bs=a.querySelectorAll("button");if(m.type==="text")bs[0].onclick=()=>startEdit(m);bs[bs.length-1].onclick=()=>del(m);b.appendChild(a)}
  row.appendChild(b);box.appendChild(row);
 }
 box.scrollTop=box.scrollHeight;
}
function startEdit(m){editId=m.id;$("text").value=m.text||"";$("editBar").style.display="flex";$("text").focus()}
$("cancelEdit").onclick=()=>{editId=null;$("text").value="";$("editBar").style.display="none"};

function del(m){if(!confirm("این پیام حذف شود؟"))return;messages=messages.filter(x=>x.id!==m.id);save();render()}
$("form").onsubmit=e=>{
 e.preventDefault();let t=$("text").value.trim();if(!t)return;
 if(editId){let m=messages.find(x=>x.id===editId);if(m){m.text=t;m.edited=true}editId=null;$("editBar").style.display="none"}
 else messages.push({id:crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random(),user,text:t,type:"text",time:Date.now()});
 messages=messages.slice(-500);save();$("text").value="";render();
};
$("file").onchange=()=>{
 const f=$("file").files[0];if(!f)return;
 if(!f.type.startsWith("image/")&&!f.type.startsWith("video/"))return alert("فقط عکس و ویدیو مجاز است.");
 if(f.size>25*1024*1024)return alert("حداکثر حجم 25MB است.");
 const url=URL.createObjectURL(f);
 messages.push({id:Date.now()+Math.random(),user,text:f.name,type:f.type.startsWith("image/")?"image":"video",url,time:Date.now()});
 messages=messages.slice(-100);save();render();$("file").value="";
};

$("join").onclick=()=>{let n=$("name").value.trim();if(!n)return alert("نامت را وارد کن.");user=n.slice(0,24);localStorage.setItem("alpha_demo_user",user);$("login").style.display="none";render();$("text").focus()};
$("name").onkeydown=e=>{if(e.key==="Enter")$("join").click()};

function cleanup4h(){
 const now=Date.now(),last=Number(localStorage.getItem("alpha_demo_cleanup")||0);
 if(!last){localStorage.setItem("alpha_demo_cleanup",String(now));return}
 if(now-last>=4*60*60*1000){messages=[];localStorage.removeItem("alpha_demo_messages");localStorage.setItem("alpha_demo_cleanup",String(now));render();alert("پیام‌ها پس از ۴ ساعت به‌صورت خودکار پاک شدند.")}
}
if(user){$("login").style.display="none";render()}
cleanup4h();setInterval(cleanup4h,60000);
</script>
</body>
</html>
